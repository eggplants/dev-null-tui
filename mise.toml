[tools]
"aqua:azu/dockerfile-pin" = "latest" # [skip ci]
claude = "latest" # [skip ci]
go = "1.27"
goreleaser = "latest"
pinact = "latest" # [skip ci]
ttyd = "latest" # [skip ci]
vhs = "latest"

[tasks.pre-commit]
depends = ["ci"]

[tasks.ci]
depends = ["goreleaser", "vet", "test", "fmt"]

[tasks.goreleaser]
run = "goreleaser check"

[tasks.vet]
run = "go vet ./..."

[tasks.test]
run = "go test ./..."

[tasks.build]
run = "go build ./cmd/dn"

[tasks.release]
run = "goreleaser release --snapshot --clean"

[tasks.fmt]
run = "go fmt ./..."

[tasks.demo]
run = """
#!/usr/bin/env bash
set -euxo pipefail
vhs demo.tape
ffmpeg -v error -y -i demo.gif -filter_complex '
  [0:v]split[a][b];
  [a]palettegen=max_colors=32:stats_mode=diff[p];
  [b][p]paletteuse=dither=none:diff_mode=rectangle' demo.min.gif
mv demo.min.gif demo.gif
"""
